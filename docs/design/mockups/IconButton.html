<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconButton · Peekumi design</title>
<link rel="stylesheet" href="../../../frontend/tokens.css">
<link rel="stylesheet" href="../../../frontend/ui.css">
<style>body { margin: 0; padding: 24px; background: var(--canvas); display: grid; gap: 24px; justify-items: start; }
.gallery-box { display: grid; gap: 16px; padding: 16px; background: var(--surface); }
.gallery-glass { background: var(--glass); }
.gallery-title { margin: 8px 0 0; font: 600 14px/20px var(--font-ui); color: var(--ink-muted); }
.gallery-peeks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; }
.gallery-peek { display: grid; justify-items: center; gap: 4px; margin: 0; text-align: center; }
.gallery-peek .pk-peek { width: 64px; height: 64px; }
.gallery-peek figcaption { display: grid; font: 400 12px/16px var(--font-ui); color: var(--ink-muted); }
.gallery-peek figcaption code { font: 600 12px/16px var(--font-mono); color: var(--ink); }
.gallery-flow-head { display: grid; gap: 4px; max-width: 760px; }
.gallery-flow-head h2 { margin: 0; font: 600 20px/26px var(--font-ui); color: var(--ink); }
.gallery-flow-head p { margin: 0; font: 400 14px/20px var(--font-ui); color: var(--ink-muted); }
.gallery-flow-head .counts { font: 600 14px/20px var(--font-ui); color: var(--ink); }
.gallery-flow { display: flex; gap: 24px; align-items: flex-start; }
.gallery-step { display: grid; gap: 8px; width: 390px; margin: 0; }
.gallery-step figcaption { display: flex; gap: 8px; min-height: 40px; font: 400 14px/20px var(--font-ui); color: var(--ink); }
.gallery-step figcaption b { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 12px/16px var(--font-ui); }
</style>
<script>const t = new URLSearchParams(location.search).get("theme"); if (t) document.documentElement.dataset.theme = t;</script>
</head>
<body>
<div style="width: 390px"><div class="pk gallery-box"><div class="pk-actions"><button type="button" class="pk-icon-button" aria-label="Tasks" title="Tasks"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M3 5l2 2 3-3M10 6h7M3 13l2 2 3-3M10 14h7"></path></svg></button><button type="button" class="pk-icon-button" aria-label="Tasks, an agent works" title="Tasks, an agent works" data-dot="accent"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M3 5l2 2 3-3M10 6h7M3 13l2 2 3-3M10 14h7"></path></svg></button><button type="button" class="pk-icon-button" aria-label="Tasks, needs you" title="Tasks, needs you" data-dot="warning"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M3 5l2 2 3-3M10 6h7M3 13l2 2 3-3M10 14h7"></path></svg></button><button type="button" class="pk-icon-button" aria-label="Notifications on" title="Notifications on" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M5 14V9a5 5 0 0 1 10 0v5l1.5 1.5h-13ZM8.3 17.5a1.8 1.8 0 0 0 3.4 0"></path></svg></button><button type="button" class="pk-icon-button is-quiet" aria-label="Back" title="Back"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M12 4l-6 6 6 6"></path></svg></button><button type="button" class="pk-icon-button is-quiet" aria-label="Close" title="Close"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M5 5l10 10M15 5L5 15"></path></svg></button></div></div></div>
</body>
</html>
