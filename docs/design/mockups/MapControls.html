<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapControls · Peekumi design</title>
<link rel="stylesheet" href="../../../frontend/tokens.css">
<link rel="stylesheet" href="../../../frontend/ui.css">
<style>body { margin: 0; padding: 24px; background: var(--canvas); display: grid; gap: 24px; justify-items: start; }
.gallery-box { display: grid; gap: 16px; padding: 16px; background: var(--surface); }
.gallery-glass { background: var(--glass); }
.gallery-title { margin: 8px 0 0; font: 600 14px/20px var(--font-ui); color: var(--ink-muted); }
.gallery-peeks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; }
.gallery-peek { display: grid; justify-items: center; gap: 4px; margin: 0; text-align: center; }
.gallery-peek .pk-peek { width: 64px; height: 64px; }
.gallery-peek figcaption { display: grid; font: 400 12px/16px var(--font-ui); color: var(--ink-muted); }
.gallery-peek figcaption code { font: 600 12px/16px var(--font-mono); color: var(--ink); }
.gallery-flow-head { display: grid; gap: 4px; max-width: 760px; }
.gallery-flow-head h2 { margin: 0; font: 600 20px/26px var(--font-ui); color: var(--ink); }
.gallery-flow-head p { margin: 0; font: 400 14px/20px var(--font-ui); color: var(--ink-muted); }
.gallery-flow-head .counts { font: 600 14px/20px var(--font-ui); color: var(--ink); }
.gallery-flow { display: flex; gap: 24px; align-items: flex-start; }
.gallery-step { display: grid; gap: 8px; width: 390px; margin: 0; }
.gallery-step figcaption { display: flex; gap: 8px; min-height: 40px; font: 400 14px/20px var(--font-ui); color: var(--ink); }
.gallery-step figcaption b { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 12px/16px var(--font-ui); }
</style>
<script>const t = new URLSearchParams(location.search).get("theme"); if (t) document.documentElement.dataset.theme = t;</script>
</head>
<body>
<div style="width: 390px"><div class="pk-map" style="height: 100px"><div class="pk-map-plane" style="width: 390px; height: 100px"><svg class="pk-edges" viewBox="0 0 390 100" aria-hidden="true"><defs><pattern id="grid-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="pk-grid-dot" cx="8" cy="8" r="1"></circle></pattern></defs><rect x="-400" y="-400" width="4000" height="4000" fill="url(#grid-dots)"></rect></svg></div><div class="pk-map-controls"><button type="button" class="pk-icon-button" aria-label="Home" title="Home"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M3 9l7-6 7 6v8H3ZM8 17v-5h4v5"></path></svg></button><button type="button" class="pk-icon-button" aria-label="Up" title="Up"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M9 13L4 8l5-5M4 8h8a4 4 0 0 1 4 4v5"></path></svg></button><span class="divider"></span><button type="button" class="pk-icon-button" aria-label="Changes only" title="Changes only"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M3 4h14l-5.5 6.5V16l-3 1.5v-7Z"></path></svg></button><button type="button" class="pk-icon-button" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M4 10h12"></path></svg></button><button type="button" class="pk-icon-button" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M10 4v12M4 10h12"></path></svg></button><button type="button" class="pk-icon-button" aria-label="Fit" title="Fit"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"></path></svg></button><button type="button" class="pk-icon-button" aria-label="Key" title="Key"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" class="pk-i"><path d="M3 4h4v4H3ZM3 12h4v4H3ZM10 6h7M10 14h7"></path></svg></button></div></div></div>

</html>
