<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F2F2F7" />
    <title>Repo Strata</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="connect" class="connect" hidden>
      <section class="connect-card">
        <h1>Repo strata</h1>
        <p>
          Open your private access link to explore the repository, or enter its
          access token.
        </p>
        <form id="login">
          <label for="token">Access token</label
          ><input
            id="token"
            type="password"
            required
            autocomplete="off"
          /><button class="btn primary" type="submit">Open repository</button>
        </form>
        <p id="login-error" role="alert"></p>
      </section>
    </div>
    <div class="app" id="workspace">
      <header class="top">
        <div>
          <span class="repo" id="repo-name">Repo strata</span
          ><span class="sub" id="repo-sub">Connecting to your repository…</span>
        </div>
        <div class="top-actions">
          <button
            class="refresh"
            id="refresh"
            aria-label="Refresh repository"
            title="Refresh repository"
          >
            ↻
          </button>
          <div class="seg" role="group" aria-label="View">
            <button type="button" data-mode="time" aria-pressed="false">
              Time</button
            ><button type="button" data-mode="diff" aria-pressed="true">
              Diff
            </button>
          </div>
        </div>
      </header>
      <main class="stage" id="stage" aria-label="Repository map">
        <div class="map-toolbar">
          <details id="revisionDetails" class="revision-details map-history">
            <summary>History <span id="revisionSummary"></span></summary>
            <div class="history-content">
              <div id="commitHead"></div>
              <div id="commitBar"></div>
            </div>
          </details>
          <details id="mapLegend">
            <summary>Legend</summary>
            <div id="legendContent" class="legend-popover"></div>
          </details>
        </div>
        <div id="timeRail" aria-label="Commit mini cards" hidden></div>
        <div class="deck" id="deck">
          <div class="loading-message">Opening your workspace…</div>
        </div>
        <div class="stage-foot">
          <div class="seg glass" role="group" aria-label="Colour shows">
            <button type="button" data-lens="structure" aria-pressed="false">
              Structure</button
            ><button type="button" data-lens="changes" aria-pressed="true">
              Changes
            </button>
          </div>
          <div
            class="seg glass"
            id="baSeg"
            role="group"
            aria-label="Before or after"
          >
            <button type="button" data-ba="before" aria-pressed="false">
              Before</button
            ><button type="button" data-ba="after" aria-pressed="true">
              After
            </button>
          </div>
        </div>
      </main>
      <section class="panel" id="panel" aria-label="Review" data-height="peek">
        <button
          id="sheetHandle"
          type="button"
          aria-label="Expand review sheet"
          title="Drag up or down; click to change height"
        >
          <span></span>
        </button>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="reviewScope"></div>
        <p id="selectionSummary"></p>
        <div id="reviewScroll">
          <nav id="helperTools" aria-label="Inspection views">
            <button type="button" class="btn" data-tab="details">
              Details
            </button>
            <button type="button" class="btn" data-tab="source">Source</button>
            <button type="button" class="btn" data-tab="changes">
              Changes
            </button>
            <button type="button" class="btn" data-tab="dependencies">
              Relations
            </button>
            <button type="button" class="btn" id="showDiscussion">
              Discussion
            </button>
          </nav>
          <section id="selectionDetails"><div id="selStrip"></div></section>
          <div id="runBar"></div>
          <div id="tabBody" role="tabpanel"></div>
        </div>
        <div id="conversationDock" aria-label="Ask or comment">
          <div id="reviewActions">
            <div
              class="tabs"
              role="tablist"
              id="tabs"
              aria-label="Message action"
            >
              <button
                type="button"
                role="tab"
                data-compose="ask"
                aria-selected="true"
              >
                Ask
              </button>
              <button
                type="button"
                role="tab"
                id="newComment"
                data-compose="comments"
                aria-selected="false"
              >
                Comment
              </button>
            </div>
            <span id="dockContext"></span>
          </div>
          <div id="composerHost"></div>
        </div>
      </section>
    </div>
  </body>
</html>
